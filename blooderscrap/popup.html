<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeriesMetro Navigator & Companion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --bg2: #18181c;
    --bg3: #22222a;
    --accent: #e5383b;
    --accent2: #ff6b6b;
    --text: #f0f0f0;
    --muted: #888;
    --border: rgba(255,255,255,0.08);
    --radius: 8px;
  }

  body {
    width: 420px;
    min-height: 550px;
    max-height: 620px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }

  .logo {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: white; flex-shrink: 0;
  }

  header h1 { font-size: 14px; font-weight: 600; flex: 1; }

  .badge {
    font-size: 10px; background: var(--bg3);
    color: var(--muted); padding: 2px 7px;
    border-radius: 20px; border: 1px solid var(--border);
  }

  /* --- Companion integration bar --- */
  .companion-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: #e5383b;
    color: white;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .companion-connection-input {
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    padding: 3px 6px;
    color: white;
    width: 124px;
    font-size: 11px;
    outline: none;
    font-family: monospace;
    text-align: center;
  }
  .companion-connection-input::placeholder {
    color: rgba(255,255,255,0.6);
  }
  .companion-btn {
    background: white;
    color: #e5383b;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 10px;
  }
  .companion-btn:hover {
    background: #f0f0f0;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffc107;
    display: inline-block;
    box-shadow: 0 0 5px #ffc107;
  }
  .status-dot.active {
    background: #22c55e;
    box-shadow: 0 0 5px #22c55e;
  }

  .search-bar {
    display: flex; gap: 6px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }

  .search-bar input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 7px 10px;
    color: var(--text); font-size: 13px; outline: none;
    transition: border-color .2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  .search-bar button {
    background: var(--accent); border: none; border-radius: var(--radius);
    color: white; padding: 7px 14px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: background .15s;
  }
  .search-bar button:hover { background: var(--accent2); }

  .tabs {
    display: flex; gap: 2px;
    padding: 8px 14px 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }

  .tab {
    padding: 6px 12px; border-radius: var(--radius) var(--radius) 0 0;
    cursor: pointer; font-size: 12px; color: var(--muted);
    border: 1px solid transparent; border-bottom: none;
    transition: all .15s; background: transparent;
  }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .tab:hover:not(.active) { color: var(--text); }

  .content {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    scrollbar-width: thin; scrollbar-color: var(--bg3) transparent;
  }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }

  .serie-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .serie-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .serie-card:hover { border-color: var(--accent); transform: translateY(-1px); }

  .serie-card img {
    width: 100%; aspect-ratio: 2/3; object-fit: cover;
    display: block; background: var(--bg3);
  }

  .serie-card .info {
    padding: 7px 8px;
  }
  .serie-card .title {
    font-size: 11px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .serie-card .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }

  .ep-list { display: flex; flex-direction: column; gap: 4px; }

  .ep-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: border-color .15s;
  }
  .ep-item:hover { border-color: var(--accent); }

  .ep-num {
    font-size: 10px; color: var(--muted);
    min-width: 28px; text-align: center;
    background: var(--bg3); padding: 2px 4px; border-radius: 4px;
  }
  .ep-title { flex: 1; font-size: 12px; line-height: 1.3; }
  .ep-play {
    width: 24px; height: 24px; background: var(--accent);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: white; flex-shrink: 0;
  }

  .player-panel { display: flex; flex-direction: column; gap: 10px; }

  .player-title {
    font-size: 13px; font-weight: 600; line-height: 1.4;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }

  .opciones-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

  .opciones-grid { display: flex; flex-wrap: wrap; gap: 6px; }

  .opcion-btn {
    padding: 6px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); cursor: pointer; font-size: 12px;
    transition: all .15s; display: flex; align-items: center; gap: 5px;
  }
  .opcion-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .opcion-btn .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-lat { background: #4caf50; }
  .dot-cast { background: #2196f3; }
  .dot-vose { background: #ff9800; }
  .dot-gen { background: var(--muted); }

  .nav-row {
    display: flex; gap: 6px; margin-top: 4px;
  }

  .nav-btn {
    flex: 1; padding: 7px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--muted); cursor: pointer; font-size: 12px;
    transition: all .15s; text-align: center;
  }
  .nav-btn:hover { border-color: var(--border); color: var(--text); }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-btn.back-serie { color: var(--accent); border-color: var(--accent); }
  .nav-btn.back-serie:hover { background: rgba(229,56,59,.1); }

  .status {
    padding: 8px 10px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--muted); font-size: 12px; text-align: center;
  }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pager {
    display: flex; justify-content: center; align-items: center;
    gap: 8px; margin-top: 10px;
  }
  .pager button {
    padding: 5px 12px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); cursor: pointer; font-size: 12px;
  }
  .pager button:disabled { opacity: .3; cursor: default; }
  .pager button:not(:disabled):hover { border-color: var(--accent); }
  .pager span { font-size: 12px; color: var(--muted); }

  .back-btn {
    display: flex; align-items: center; gap: 5px;
    color: var(--muted); cursor: pointer; font-size: 12px;
    margin-bottom: 10px; padding: 4px 0;
    transition: color .15s;
  }
  .back-btn:hover { color: var(--text); }

  .notice {
    font-size: 11px; color: var(--muted); text-align: center;
    padding: 6px; border-radius: var(--radius);
    background: var(--bg2); border: 1px solid var(--border);
  }

  .trid-info {
    font-size: 11px; color: var(--muted);
    padding: 6px 10px; background: var(--bg3);
    border-radius: var(--radius); font-family: monospace;
  }

  .section-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 8px; margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">SM</div>
  <h1>SeriesMetro Navigator</h1>
  <span class="badge">v1.0</span>
</header>

<!-- Companion Connection Bar -->
<div class="companion-bar">
  <span>
    <span class="status-dot" id="companionStatusDot"></span>
    BloodersTV Link
  </span>
  <div>
    <input type="text" class="companion-connection-input" id="tvIpInput" placeholder="IP: e.g. 192.168.1.5" />
    <button class="companion-btn" id="connectTvBtn">Enlazar</button>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Buscar serie... (ej: Breaking Bad)" />
  <button id="searchBtn">Buscar</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="catalogo">Catálogo</div>
  <div class="tab" data-tab="recientes">Recientes</div>
</div>

<div class="content" id="mainContent">
  <div class="status"><span class="spinner"></span>Cargando catálogo...</div>
</div>

<script src="popup.js"></script>
</body>
</html>
